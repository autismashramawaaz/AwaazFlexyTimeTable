services:
  - type: web
    name: awaazflexytimetable
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GIT_AUTO_PUSH
        value: false
      - key: WEB_CONCURRENCY
        value: 4 